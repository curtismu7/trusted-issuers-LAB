name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 26 }
      - run: npm ci
      - run: npm test
      - run: node scripts/doctor.mjs
      - run: bash scripts/check-no-ai-attribution.sh
  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: scan history for forbidden strings
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          if [ -z "$FORBIDDEN_STRINGS" ]; then echo "FORBIDDEN_STRINGS secret not set (owner)"; exit 1; fi
          COUNT=$(git log -p --all | grep -cF -f <(echo "$FORBIDDEN_STRINGS") || true)
          echo "matches: $COUNT"; test "$COUNT" -eq 0
      # The gitleaks CLI over the whole history, as the sibling labs run it. gitleaks-action scans
      # <first pushed commit>^..<last>, which fails when the first pushed commit is the root commit.
      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.18.4
          curl -sSLO "$base/gitleaks_8.18.4_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_8.18.4_checksums.txt"
          grep ' gitleaks_8.18.4_linux_x64.tar.gz$' gitleaks_8.18.4_checksums.txt | sha256sum -c -
          tar -xz -f gitleaks_8.18.4_linux_x64.tar.gz gitleaks
          ./gitleaks version
      - name: gitleaks
        run: ./gitleaks detect --source . --redact --no-banner
